name: TrainLedger
options:
  bundleIdPrefix: com.trainledger
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: 0.3.1
    CURRENT_PROJECT_VERSION: '9'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  TrainLedger:
    type: application
    platform: iOS
    sources:
    - path: Sources
    - path: Shared
    entitlements:
      path: Sources/App/TrainLedger.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
        - group.com.trainledger.shared
    dependencies:
    - target: TrainLedgerWidgets
      embed: true
    - target: TrainLedgerWatch
      embed: true
      copy:
        destination: wrapper
        subpath: Watch
    info:
      path: Targets/App/Info.plist
      properties:
        CFBundleDisplayName: 练账
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: 读取体重与活动能量，用于计算减脂期的力量保持率与容量趋势；数据只保存在本机。
        NSHealthUpdateUsageDescription: 在获得授权后把训练记录写入「健康」，方便在系统里统一查看。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trainledger.app
        PRODUCT_NAME: TrainLedger
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
  TrainLedgerWidgets:
    type: app-extension
    platform: iOS
    sources:
    - path: Targets/Widgets
    - path: Shared/Activity
    - path: Shared/Widget
    - path: Sources/Resources/PrivacyInfo.xcprivacy
    - path: Shared/L10n
    - path: Sources/Resources/zh-Hans.lproj
    - path: Sources/Resources/en.lproj
    entitlements:
      path: Targets/Widgets/TrainLedgerWidgets.entitlements
      properties:
        com.apple.security.application-groups:
        - group.com.trainledger.shared
    info:
      path: Targets/Widgets/Info.plist
      properties:
        CFBundleDisplayName: 练账
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trainledger.app.widgets
        PRODUCT_NAME: TrainLedgerWidgets
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
  TrainLedgerWatch:
    type: application
    platform: watchOS
    sources:
    - path: Targets/Watch
    - path: Shared/Watch
    - path: Sources/Resources/PrivacyInfo.xcprivacy
    - path: Shared/L10n
    - path: Sources/Resources/zh-Hans.lproj
    - path: Sources/Resources/en.lproj
    info:
      path: Targets/Watch/Info.plist
      properties:
        CFBundleDisplayName: 练账
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.trainledger.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trainledger.app.watchkitapp
        PRODUCT_NAME: TrainLedgerWatch
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: true
  TrainLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: Tests
    dependencies:
    - target: TrainLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trainledger.app.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  TrainLedger:
    build:
      targets:
        TrainLedger: all
        TrainLedgerTests:
        - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
      - TrainLedgerTests
