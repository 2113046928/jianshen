name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 单元测试（不签名）
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project TrainLedger.xcodeproj \
            -scheme TrainLedger \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      # 错误同时写 summary（给人看）和 annotation（给 API 读）
      - name: 汇总错误
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            if [ -f build.log ]; then
              echo '```'
              grep -E "error:|BUILD FAILED|Testing failed|The following build commands failed" build.log | head -60 || true
              echo '```'
            else
              echo "没有 build.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f build.log ]; then
            COUNT=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::${line:0:400}"
              COUNT=$((COUNT + 1))
              [ "$COUNT" -ge 8 ] && break
            done <<< "$(grep -E 'error:' build.log | head -8)"
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::xcodebuild 失败但没有匹配到 error: 行，请查看 job summary"
            fi
          fi

      - name: 标记失败
        if: steps.test.outcome == 'failure'
        run: exit 1
