name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 关键：用**最新**的 Xcode。runner 上可能同时装了多个版本，
      # 老版本（如 Xcode_16.0）常常没有配套的 iOS 模拟器运行时，
      # 会报 "iOS 18.0 is not installed" 然后找不到任何 destination。
      - name: 选择最新 Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST"
          fi
          xcode-select -p
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 确认模拟器运行时
        run: |
          xcrun simctl list runtimes || true
          if ! xcrun simctl list devices available | grep -q "iPhone"; then
            echo "没有可用 iPhone 模拟器，开始下载 iOS 平台（可能几分钟）"
            sudo xcodebuild -downloadPlatform iOS || true
          fi
          xcrun simctl list devices available | head -30

      - name: 单元测试（不签名）
        id: test
        continue-on-error: true
        run: |
          set -o pipefail

          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(data.items()):
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          " || true)

          if [ -z "$DEVICE_ID" ]; then
            echo "::error::没有可用的 iPhone 模拟器，运行时不完整"
            xcrun simctl list runtimes || true
            exit 1
          fi

          echo "simulator: $DEVICE_ID"
          xcodebuild test \
            -project TrainLedger.xcodeproj \
            -scheme TrainLedger \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      # 错误同时写 summary（给人看）和 annotation（给 API 读）
      - name: 汇总错误
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            if [ -f build.log ]; then
              echo '```'
              grep -E "error:|BUILD FAILED|Testing failed|The following build commands failed|failed \(" build.log | head -60 || true
              echo '```'
              echo ""
              echo "### 日志尾部"
              echo '```'
              tail -30 build.log 2>/dev/null || true
              echo '```'
            else
              echo "没有 build.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f build.log ]; then
            COUNT=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::${line:0:400}"
              COUNT=$((COUNT + 1))
              [ "$COUNT" -ge 8 ] && break
            done <<< "$(grep -E 'error:|Testing failed|failed \(' build.log | head -8)"
            if [ "$COUNT" -eq 0 ]; then
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                echo "::error::${line:0:400}"
              done <<< "$(tail -6 build.log)"
            fi
          fi

      - name: 标记失败
        if: steps.test.outcome == 'failure'
        run: exit 1
