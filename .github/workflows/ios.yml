name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          if [ -d /Applications/Xcode_16.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          else
            NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            [ -n "$NEWEST" ] && sudo xcode-select -s "$NEWEST"
          fi
          xcode-select -p

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 单元测试（不签名）
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -version || true

          # runner 上模拟器型号不固定：先自动挑一台可用的 iPhone，
          # 挑不到就退回按名字找，避免整步因为选设备失败而没有日志。
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(data.items()):
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          " || true)

          if [ -n "$DEVICE_ID" ]; then
            DESTINATION="platform=iOS Simulator,id=$DEVICE_ID"
          else
            DESTINATION="platform=iOS Simulator,name=iPhone 16"
          fi
          echo "destination: $DESTINATION"

          xcodebuild test \
            -project TrainLedger.xcodeproj \
            -scheme TrainLedger \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      # 错误同时写 summary（给人看）和 annotation（给 API 读）
      - name: 汇总错误
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            if [ -f build.log ]; then
              echo '```'
              grep -E "error:|BUILD FAILED|Testing failed|The following build commands failed|failed \(" build.log | head -60 || true
              echo '```'
              echo ""
              echo "### 日志尾部"
              echo '```'
              tail -30 build.log 2>/dev/null || true
              echo '```'
            else
              echo "没有 build.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f build.log ]; then
            COUNT=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::${line:0:400}"
              COUNT=$((COUNT + 1))
              [ "$COUNT" -ge 8 ] && break
            done <<< "$(grep -E 'error:|Testing failed|failed \(' build.log | head -8)"
            if [ "$COUNT" -eq 0 ]; then
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                echo "::error::${line:0:400}"
              done <<< "$(tail -6 build.log)"
            fi
          fi

      - name: 标记失败
        if: steps.test.outcome == 'failure'
        run: exit 1
