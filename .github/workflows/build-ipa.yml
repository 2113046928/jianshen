name: Build IPA

# 用 GitHub 的 macOS runner 产出未签名 ipa（无需证书）。
# 需要签名的 TestFlight 包见 scripts/archive.sh 与 README 的「发布与 CI」一节。
#
# 两个坑，都踩过了：
# 1) `xcodebuild archive` + CODE_SIGNING_ALLOWED=NO 会把 actool 指到 iphonesimulator
#    SDK，报 "No simulator runtime version ... available"。
# 2) 同时给 `-sdk iphoneos` 和 `-destination generic/platform=iOS` 时，
#    destination 会覆盖 sdk，还是掉进同一个坑。
# 现在只用 SDKROOT=iphoneos，不给 destination。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新 Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST"
          fi
          xcode-select -p
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程（仅主 App，供未签名打包验证）
        run: |
          set -o pipefail
          WITH_WATCH=0 WITH_WIDGET=0 WITH_ENTITLEMENTS=0 \
            python3 scripts/gen_project.py 2>&1 | tee gen.log

      - name: 环境信息
        continue-on-error: true
        run: |
          xcodebuild -version
          echo "---"
          xcodebuild -showsdks || true

      - name: 编译（禁用签名，iphoneos）
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project TrainLedger.xcodeproj \
            -scheme TrainLedger \
            -configuration Release \
            -sdk iphoneos \
            SDKROOT=iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build.log

      # 错误同时写 summary（给人看）和 annotation（给 API 读）
      - name: 汇总错误
        if: always()
        run: |
          {
            echo "## 编译结果"
            echo ""
            if [ -f build.log ]; then
              echo '```'
              grep -E "error:|BUILD FAILED|The following build commands failed" build.log | head -60 || true
              echo '```'
            else
              echo "没有 build.log"
            fi
            echo ""
            echo "### 日志尾部"
            echo '```'
            tail -30 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f build.log ]; then
            COUNT=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::${line:0:400}"
              COUNT=$((COUNT + 1))
              [ "$COUNT" -ge 8 ] && break
            done <<< "$(grep -E 'error:' build.log | head -8)"
            if [ "$COUNT" -eq 0 ]; then
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                echo "::error::${line:0:400}"
              done <<< "$(tail -6 build.log)"
            fi
          fi

      - name: 打包 ipa
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          # 不假设产物目录名，直接在 derived data 里找 .app；
          # 找不到就把目录结构打出来，避免又一次"静默 exit 1"。
          APP=$(find build -maxdepth 6 -type d -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::找不到 .app，以下是 build/ 下的目录结构"
            find build -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "app: $APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry TrainLedger-unsigned.ipa Payload
          ls -lh TrainLedger-unsigned.ipa

      - name: 上传产物
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TrainLedger-unsigned-ipa
          path: dist/TrainLedger-unsigned.ipa
          retention-days: 14

      - name: 把构建日志推到 ci-log 分支
        if: always()
        continue-on-error: true
        run: |
          {
            echo "sha: ${GITHUB_SHA:-?}"
            echo "run: ${GITHUB_RUN_ID:-?}"
            echo "ref: ${GITHUB_REF_NAME:-?}"
            echo
            for f in gen.log build.log archive.log export.log; do
              if [ -f "$f" ]; then
                echo "===== $f ====="
                tail -120 "$f"
                echo
              fi
            done
          } > ci-last-build.log

          git config user.name "ci-bot"
          git config user.email "ci@trainledger.local"
          git add -f ci-last-build.log
          git commit -m "ci: 构建日志 $(date -u +%FT%TZ)" || true
          git push -f origin HEAD:refs/heads/ci-log

      - name: 标记失败
        if: steps.build.outcome == 'failure'
        run: exit 1
