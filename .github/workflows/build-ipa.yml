name: Build IPA

# 用 GitHub 的 macOS runner 产出未签名 ipa（无需证书）。
# 需要签名的 TestFlight 包见 scripts/archive.sh 与 README 的「发布与 CI」一节。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: python3 scripts/gen_project.py

      - name: 归档（禁用签名）
        id: archive
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild archive \
            -project TrainLedger.xcodeproj \
            -scheme TrainLedger \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TrainLedger.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee archive.log

      # 归档错误写进 job summary，公开仓库无需凭据即可查看
      - name: 汇总归档错误
        if: always()
        run: |
          {
            echo "## 归档结果"
            echo ""
            if [ -f archive.log ]; then
              echo '```'
              grep -E "error:|BUILD FAILED|The following build commands failed|requires a provisioning|cannot find" archive.log | head -60 || true
              echo '```'
              echo ""
              echo "### 错误上下文"
              echo '```'
              grep -B3 -A8 "error:" archive.log | head -150 || true
              echo '```'
            else
              echo "没有 archive.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f archive.log ]; then
            COUNT=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::${line:0:400}"
              COUNT=$((COUNT + 1))
              [ "$COUNT" -ge 8 ] && break
            done <<< "$(grep -E 'error:' archive.log | head -8)"
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::归档失败但没有匹配到 error: 行，请查看 job summary"
            fi
          fi

      - name: 打包 ipa
        if: steps.archive.outcome == 'success'
        run: |
          set -euo pipefail
          APP=$(find build/TrainLedger.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry TrainLedger-unsigned.ipa Payload
          ls -lh TrainLedger-unsigned.ipa

      - name: 上传产物
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TrainLedger-unsigned-ipa
          path: build/TrainLedger-unsigned.ipa
          retention-days: 14

      - name: 标记失败
        if: steps.archive.outcome == 'failure'
        run: exit 1
