name: Build IPA

# 用 GitHub 的 macOS runner 产出未签名 ipa（无需证书）。
# 需要签名的 TestFlight 包见 scripts/archive.sh 与 README 的「签名」一节。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: python3 scripts/gen_project.py

      - name: 归档（禁用签名）
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project TrainLedger.xcodeproj \
            -scheme TrainLedger \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TrainLedger.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: 打包 ipa
        run: |
          set -euo pipefail
          APP=$(find build/TrainLedger.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry TrainLedger-unsigned.ipa Payload
          ls -lh TrainLedger-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TrainLedger-unsigned-ipa
          path: build/TrainLedger-unsigned.ipa
          retention-days: 14
