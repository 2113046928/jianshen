name: Sign IPA

# 带签名打包。需要先在仓库 Settings → Secrets and variables → Actions 里配置 5 个密钥，
# 具体做法见 docs/release/signing.md。缺任何一个都会在第一步就明确报错。
#
# 只处理主 App（裁剪 watch / widget），因为一个 profile 只能覆盖一个 bundle id；
# 打通后再按需补 widget / watch 的 profile。

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "导出方式：development（装登记设备）/ ad-hoc / app-store-connect"
        required: true
        default: "development"
      keep_entitlements:
        description: "保留 HealthKit 与 App Group（要求 profile 已开通这两个能力）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新 Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$NEWEST" ] && sudo xcode-select -s "$NEWEST"
          xcode-select -p
          xcodebuild -version

      - name: 检查签名密钥是否齐全
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROFILE_SPECIFIER: ${{ secrets.PROFILE_SPECIFIER }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          MISSING=""
          [ -z "${BUILD_CERTIFICATE_BASE64:-}" ] && MISSING="$MISSING BUILD_CERTIFICATE_BASE64"
          [ -z "${P12_PASSWORD:-}" ] && MISSING="$MISSING P12_PASSWORD"
          [ -z "${PROVISIONING_PROFILE_BASE64:-}" ] && MISSING="$MISSING PROVISIONING_PROFILE_BASE64"
          [ -z "${PROFILE_SPECIFIER:-}" ] && MISSING="$MISSING PROFILE_SPECIFIER"
          [ -z "${TEAM_ID:-}" ] && MISSING="$MISSING TEAM_ID"

          if [ -n "$MISSING" ]; then
            echo "::error::缺少仓库 Secrets:$MISSING"
            {
              echo "## 缺少签名密钥"
              echo ""
              echo "需要配置以下仓库 Secrets："
              echo '```'
              echo "BUILD_CERTIFICATE_BASE64"$'\n'"P12_PASSWORD"$'\n'"PROVISIONING_PROFILE_BASE64"$'\n'"PROFILE_SPECIFIER"$'\n'"TEAM_ID"
              echo '```'
              echo "缺少：$MISSING"
              echo ""
              echo "做法见 docs/release/signing.md"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "密钥齐全"

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程（仅主 App）
        env:
          KEEP_ENTITLEMENTS: ${{ inputs.keep_entitlements }}
        run: |
          if [ "$KEEP_ENTITLEMENTS" = "true" ]; then
            WITH_WATCH=0 WITH_WIDGET=0 python3 scripts/gen_project.py
          else
            WITH_WATCH=0 WITH_WIDGET=0 WITH_ENTITLEMENTS=0 python3 scripts/gen_project.py
          fi

      - name: 安装证书与描述文件
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          echo "--- 可用签名身份 ---"
          security find-identity -v -p codesigning build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "--- 描述文件信息 ---"
          security cms -D -i profile.mobileprovision > profile.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :Name" profile.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" profile.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist 2>/dev/null || true

      - name: 归档（带签名）
        id: archive
        continue-on-error: true
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_SPECIFIER: ${{ secrets.PROFILE_SPECIFIER }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          set -o pipefail
          if [ "$EXPORT_METHOD" = "app-store-connect" ]; then
            IDENTITY="Apple Distribution"
          else
            IDENTITY="Apple Development"
          fi
          echo "identity: $IDENTITY"

          xcodebuild archive \
            -project TrainLedger.xcodeproj \
            -scheme TrainLedger \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/TrainLedger.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tee archive.log

      - name: 汇总归档错误
        if: always()
        run: |
          {
            echo "## 归档结果"
            echo ""
            if [ -f archive.log ]; then
              echo '```'
              grep -E "error:|BUILD FAILED|does not include|No profiles|requires a provisioning" archive.log | head -40 || true
              echo '```'
              echo "### 日志尾部"
              echo '```'
              tail -25 archive.log 2>/dev/null || true
              echo '```'
            else
              echo "没有 archive.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 导出 ipa
        if: steps.archive.outcome == 'success'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_SPECIFIER: ${{ secrets.PROFILE_SPECIFIER }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          set -euo pipefail
          if [ "$EXPORT_METHOD" = "app-store-connect" ]; then
            IDENTITY="Apple Distribution"
          else
            IDENTITY="Apple Development"
          fi

          cat > ExportOptions.generated.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.trainledger.app</key>
              <string>${PROFILE_SPECIFIER}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/TrainLedger.xcarchive \
            -exportOptionsPlist ExportOptions.generated.plist \
            -exportPath build/export 2>&1 | tee export.log

          ls -lh build/export

      - name: 上传 ipa
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TrainLedger-signed-ipa
          path: |
            build/export/*.ipa
            build/export/*.dSYM.zip
          retention-days: 14

      - name: 标记失败
        if: steps.archive.outcome == 'failure'
        run: exit 1
